name: Build Ponte JAR

on:
  push:
    branches: [ "arena/cdaf6e80-minecraft" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build mod with Gradle
        working-directory: minecraft-mod
        run: |
          chmod +x gradlew || true
          ./gradlew build --no-daemon --stacktrace || gradle build --no-daemon --stacktrace
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-unity-ponte-JAR
          path: minecraft-mod/build/libs/*.jar
          if-no-files-found: error
      - name: Upload Unity package
        uses: actions/upload-artifact@v4
        with:
          name: unity-package
          path: unity-package/
      - name: Upload Godot project
        uses: actions/upload-artifact@v4
        with:
          name: godot-project
          path: godot-project/
